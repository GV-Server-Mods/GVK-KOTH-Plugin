<?xml version="1.0" encoding="utf-8"?>
<!--
  GVK KOTH config. Lives in the Torch Instance folder as GVK_KOTH.cfg.
  Edit it, then run !koth reload in game. The plugin only reads this file; it never saves over it, so comments stay.
  !koth reload lists any problems it finds (also in the Torch log and the admin Discord webhook).

  Values marked CHECK are guesses from the old KOTH prefabs or the Steam guide; confirm them in game.
  Times are UTC. Days: Sunday Monday Tuesday Wednesday Thursday Friday Saturday.
  A setting left out uses its default (shown in brackets below).
-->
<KothConfig xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

  <!-- Master switch [true]. false = no zones run, no rules apply. -->
  <Enabled>true</Enabled>

  <!-- Game ticks between zone checks [60]. 60 ticks = about once a second. Lower = more server cost. -->
  <UpdateIntervalTicks>60</UpdateIntervalTicks>

  <!-- Public Discord webhook for KOTH news (zone open/close, completed bars, weekly roll-up, point changes).
       Discord: channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL.
       Example: https://discord.com/api/webhooks/123456789012345678/AbCdEf...   Empty = no Discord posts. -->
  <DiscordWebhookUrl></DiscordWebhookUrl>

  <!-- Admin Discord webhook for problems (config errors, loot stuck, failed MES spawns). Usually a private channel.
       Empty = problems go to the Torch log only. -->
  <DiscordAdminWebhookUrl></DiscordAdminWebhookUrl>

  <!-- Optional mention added to Discord slot warnings, e.g. a role: <@&123456789012345678>
       (Discord: Server Settings > Roles > right-click the role > Copy Role ID, with Developer Mode on).
       Written in this file as &lt;@&amp;123456789012345678&gt;.  Empty = no mention. -->
  <DiscordSlotWarningPing></DiscordSlotWarningPing>

  <!-- Add GPS markers to players' GPS lists [true]: open zones and the next zone (until it closes), loot drops
       (players within 15 km, for 15 minutes). false = chat messages only. -->
  <AddGpsMarkers>true</AddGpsMarkers>

  <!-- Minutes before a slot opens to warn players [30 and 10]. A single 0 = no warnings. -->
  <SlotWarningMinutes>
    <int>30</int>
    <int>10</int>
  </SlotWarningMinutes>

  <!-- When the weekly standings post to Discord (UTC) [Monday 00:00]. Points never reset; it shows season
       totals and each faction's gain since the last roll-up. -->
  <WeeklyRollup>
    <Day>Monday</Day>
    <Hour>0</Hour>
    <Minute>0</Minute>
  </WeeklyRollup>

  <!--
    ZONES. One ZoneProfile per zone. Settings:
      Name                  Unique name, used in slots, commands, NPC tags and GVK_KOTH_<Name>_Active (MES).
      Enabled               [true]
      Mode                  Capture | Encampment | RulesOnly [Capture]
                              Capture: every faction in the zone fills one shared bar; all score when it fills.
                              Encampment: factions with a powered station inside fill the bar at 1x.
                              RulesOnly: no capture, only the rules below.
      Attach                Coordinates | NpcTag [Coordinates]
                              NpcTag: the zone follows an NPC grid whose MES behavior has a line GVK-KOTH=<Name>;
      Activation            AlwaysOn | Slot | Lifetime [Slot]
                              Slot: runs only when a slot picks it. Lifetime: NPC zones, from spawn for LifetimeMinutes.
      X, Y, Z               Zone centre (Coordinates), or the spawn point when SpawnGroup is set.
      Radius                Capture radius in metres [1500].
      LifetimeMinutes       NPC zones: minutes after the grid spawns; 0 = while the grid exists [0].
      SpawnGroup            MES spawn group spawned when a slot picks this zone (Flying KOTH). Needs Attach NpcTag
                            and [RivalAiSpawn:true] in its conditions. Empty = none.
      OnFoot, SmallGrids, LargeGrids   Who counts [false, true, true]. Seated players count by the grid they sit on.
      MinSmallGridBlocks, MinLargeGridBlocks   Smallest grid that counts [50, 100]. Encampment uses MinLargeGridBlocks.
      MinPlayers            Players needed before the bar moves [1].
      CaptureSeconds        Seconds to fill the bar with one player [300]; more players fill it faster (up to ~2x).
      IdleDrainPlayers      Empty zone drains at this many players' speed [3]; 0 = no drain.
      MinPresenceShare      Share of the bar (0 to 1) a faction must have been present for to score [0]; 0.25 = 25%.
      PointsPerCompletion   Season points per faction per filled bar [5].
      CreditsPerPoint       SC per point, paid to the faction balance [200000].
      PointsPerLoot         Zone points (all factions together) per loot drop [10]; 0 = no loot.
      Loot                  Items per drop: LootItem with TypeId (Component, Ingot, Ore, ...), SubtypeId, Amount.
      LootContainerName     Name of the loot container inside the zone [KOTH Loot]. Only containers on an
                            NPC-owned grid count; the one nearest the centre is used.
      NoThrusterRange       Player thrusters switch off within this many metres [0 = off].
      NoLargeGridPowerRange Large player grid power switches off within this range [0 = off].
      NoSafeZoneRange       Player safe zone blocks switch off within this range [0 = off].
      NoProjectorRange      Player projectors switch off within this range [0 = off].
      LinkRange             NPC blocks tagged [GVK-KOTH-Link] within this range switch on while the zone is open [0 = off].
  -->
  <Zones>
    <!-- Khar Toba: small and large grids. CHECK: X/Y/Z are the Steam guide GPS, not the old KOTH block. -->
    <ZoneProfile>
      <Name>KharToba</Name>
      <Enabled>true</Enabled>
      <Mode>Capture</Mode>
      <Attach>Coordinates</Attach>
      <Activation>Slot</Activation>
      <X>4115.21</X>
      <Y>38891.59</Y>
      <Z>26152.68</Z>
      <Radius>1500</Radius>
      <OnFoot>false</OnFoot>
      <SmallGrids>true</SmallGrids>
      <LargeGrids>true</LargeGrids>
      <MinSmallGridBlocks>50</MinSmallGridBlocks>
      <MinLargeGridBlocks>100</MinLargeGridBlocks>
      <MinPlayers>1</MinPlayers>
      <CaptureSeconds>300</CaptureSeconds>
      <IdleDrainPlayers>3</IdleDrainPlayers>
      <MinPresenceShare>0.25</MinPresenceShare>
      <PointsPerCompletion>5</PointsPerCompletion>
      <CreditsPerPoint>200000</CreditsPerPoint>
      <PointsPerLoot>10</PointsPerLoot>
      <Loot>
        <LootItem>
          <TypeId>Component</TypeId>
          <SubtypeId>GVK_SpecialPackage1</SubtypeId>
          <Amount>1</Amount>
        </LootItem>
      </Loot>
      <LootContainerName>KOTH Loot</LootContainerName>
      <NoSafeZoneRange>4000</NoSafeZoneRange>
      <NoProjectorRange>4000</NoProjectorRange>
    </ZoneProfile>
    <!-- Kalash Site: small grids only. CHECK coordinates. -->
    <ZoneProfile>
      <Name>Kalash</Name>
      <Mode>Capture</Mode>
      <Attach>Coordinates</Attach>
      <Activation>Slot</Activation>
      <X>8815.53</X>
      <Y>14612.65</Y>
      <Z>35353.97</Z>
      <Radius>1500</Radius>
      <SmallGrids>true</SmallGrids>
      <LargeGrids>false</LargeGrids>
      <MinSmallGridBlocks>50</MinSmallGridBlocks>
      <CaptureSeconds>300</CaptureSeconds>
      <IdleDrainPlayers>3</IdleDrainPlayers>
      <MinPresenceShare>0.25</MinPresenceShare>
      <PointsPerCompletion>5</PointsPerCompletion>
      <CreditsPerPoint>200000</CreditsPerPoint>
      <PointsPerLoot>10</PointsPerLoot>
      <Loot>
        <LootItem>
          <TypeId>Component</TypeId>
          <SubtypeId>GVK_SpecialPackage1</SubtypeId>
          <Amount>1</Amount>
        </LootItem>
      </Loot>
      <LootContainerName>KOTH Loot</LootContainerName>
      <NoLargeGridPowerRange>3000</NoLargeGridPowerRange>
      <NoSafeZoneRange>4000</NoSafeZoneRange>
      <NoProjectorRange>4000</NoProjectorRange>
    </ZoneProfile>
    <!-- Crashed Starship: small grid rovers. CHECK coordinates. -->
    <ZoneProfile>
      <Name>CrashedStarship</Name>
      <Mode>Capture</Mode>
      <Attach>Coordinates</Attach>
      <Activation>Slot</Activation>
      <X>25896.19</X>
      <Y>61073.49</Y>
      <Z>25738.71</Z>
      <Radius>1000</Radius>
      <SmallGrids>true</SmallGrids>
      <LargeGrids>false</LargeGrids>
      <MinSmallGridBlocks>50</MinSmallGridBlocks>
      <CaptureSeconds>300</CaptureSeconds>
      <IdleDrainPlayers>3</IdleDrainPlayers>
      <MinPresenceShare>0.25</MinPresenceShare>
      <PointsPerCompletion>5</PointsPerCompletion>
      <CreditsPerPoint>200000</CreditsPerPoint>
      <PointsPerLoot>10</PointsPerLoot>
      <Loot>
        <LootItem>
          <TypeId>Component</TypeId>
          <SubtypeId>GVK_SpecialPackage1</SubtypeId>
          <Amount>1</Amount>
        </LootItem>
      </Loot>
      <LootContainerName>KOTH Loot</LootContainerName>
      <NoThrusterRange>3000</NoThrusterRange>
      <NoLargeGridPowerRange>3000</NoLargeGridPowerRange>
      <NoSafeZoneRange>4000</NoSafeZoneRange>
      <NoProjectorRange>4000</NoProjectorRange>
    </ZoneProfile>
    <!-- Scraptown: large grids, always on. CHECK coordinates (spawn group position), points and loot
         (it used catch-up scoring and had no valid loot). -->
    <ZoneProfile>
      <Name>Scraptown</Name>
      <Mode>Capture</Mode>
      <Attach>Coordinates</Attach>
      <Activation>AlwaysOn</Activation>
      <X>10115.76</X>
      <Y>30337.47</Y>
      <Z>52205.92</Z>
      <Radius>132</Radius>
      <SmallGrids>false</SmallGrids>
      <LargeGrids>true</LargeGrids>
      <MinLargeGridBlocks>25</MinLargeGridBlocks>
      <CaptureSeconds>600</CaptureSeconds>
      <IdleDrainPlayers>3</IdleDrainPlayers>
      <PointsPerCompletion>1</PointsPerCompletion>
      <CreditsPerPoint>0</CreditsPerPoint>
      <PointsPerLoot>0</PointsPerLoot>
      <LootContainerName>KOTH Loot</LootContainerName>
    </ZoneProfile>
  </Zones>

  <!--
    SLOTS. Each slot opens one zone, picked at random from its Pool, every week at Start for DurationMinutes.
    The pick is made early (when the slot becomes the next one) so players are warned which zone is coming.
      Name             Unique name.
      Enabled          [true]
      Start            Day, Hour (0-23), Minute (0-59), UTC.
      DurationMinutes  How long the zone stays open [120].
      Pool             Zone names to pick from; each zone must have Activation Slot.
  -->
  <Slots>
    <!-- CHECK times. -->
    <SlotConfig>
      <Name>Saturday</Name>
      <Start><Day>Saturday</Day><Hour>19</Hour><Minute>0</Minute></Start>
      <DurationMinutes>120</DurationMinutes>
      <Pool><string>KharToba</string><string>Kalash</string><string>CrashedStarship</string></Pool>
    </SlotConfig>
    <SlotConfig>
      <Name>Sunday</Name>
      <Start><Day>Sunday</Day><Hour>15</Hour><Minute>0</Minute></Start>
      <DurationMinutes>120</DurationMinutes>
      <Pool><string>KharToba</string><string>Kalash</string><string>CrashedStarship</string></Pool>
    </SlotConfig>
    <SlotConfig>
      <Name>Thursday</Name>
      <Start><Day>Thursday</Day><Hour>3</Hour><Minute>0</Minute></Start>
      <DurationMinutes>120</DurationMinutes>
      <Pool><string>KharToba</string><string>Kalash</string><string>CrashedStarship</string></Pool>
    </SlotConfig>
  </Slots>
</KothConfig>
