<?xml version="1.0" encoding="utf-8"?>
<!--
  Sample GVK KOTH config. Copy to the Torch Instance folder as GVK_KOTH.cfg, edit, then !koth reload.
  Values marked CHECK are guesses from old prefabs or the Steam guide; confirm them in game.
  Times are UTC. Days: Sunday, Monday, ... Saturday.
-->
<KothConfig xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <Enabled>true</Enabled>
  <UpdateIntervalTicks>60</UpdateIntervalTicks>
  <DiscordWebhookUrl></DiscordWebhookUrl>
  <DiscordAdminWebhookUrl></DiscordAdminWebhookUrl>
  <DiscordSlotWarningPing></DiscordSlotWarningPing>
  <SlotWarningMinutes>
    <int>30</int>
    <int>10</int>
  </SlotWarningMinutes>
  <WeeklyRollup>
    <Day>Monday</Day>
    <Hour>0</Hour>
    <Minute>0</Minute>
  </WeeklyRollup>
  <Zones>
    <!-- Khar Toba: small and large grids. CHECK: X/Y/Z are the Steam guide GPS, not the old KOTH block. -->
    <ZoneProfile>
      <Name>KharToba</Name>
      <Enabled>true</Enabled>
      <Mode>Capture</Mode>
      <Attach>Coordinates</Attach>
      <Activation>Slot</Activation>
      <X>4115.21</X>
      <Y>38891.59</Y>
      <Z>26152.68</Z>
      <Radius>1500</Radius>
      <OnFoot>false</OnFoot>
      <SmallGrids>true</SmallGrids>
      <LargeGrids>true</LargeGrids>
      <MinSmallGridBlocks>50</MinSmallGridBlocks>
      <MinLargeGridBlocks>100</MinLargeGridBlocks>
      <MinPlayers>1</MinPlayers>
      <CaptureSeconds>300</CaptureSeconds>
      <IdleDrainPlayers>3</IdleDrainPlayers>
      <MinPresenceShare>0.25</MinPresenceShare>
      <PointsPerCompletion>5</PointsPerCompletion>
      <CreditsPerPoint>200000</CreditsPerPoint>
      <PointsPerLoot>10</PointsPerLoot>
      <Loot>
        <LootItem>
          <TypeId>Component</TypeId>
          <SubtypeId>GVK_SpecialPackage1</SubtypeId>
          <Amount>1</Amount>
        </LootItem>
      </Loot>
      <LootContainerName>KOTH Loot</LootContainerName>
      <NoSafeZoneRange>4000</NoSafeZoneRange>
      <NoProjectorRange>4000</NoProjectorRange>
    </ZoneProfile>
    <!-- Kalash Site: small grids only. CHECK coordinates. -->
    <ZoneProfile>
      <Name>Kalash</Name>
      <Mode>Capture</Mode>
      <Attach>Coordinates</Attach>
      <Activation>Slot</Activation>
      <X>8815.53</X>
      <Y>14612.65</Y>
      <Z>35353.97</Z>
      <Radius>1500</Radius>
      <SmallGrids>true</SmallGrids>
      <LargeGrids>false</LargeGrids>
      <MinSmallGridBlocks>50</MinSmallGridBlocks>
      <CaptureSeconds>300</CaptureSeconds>
      <IdleDrainPlayers>3</IdleDrainPlayers>
      <MinPresenceShare>0.25</MinPresenceShare>
      <PointsPerCompletion>5</PointsPerCompletion>
      <CreditsPerPoint>200000</CreditsPerPoint>
      <PointsPerLoot>10</PointsPerLoot>
      <Loot>
        <LootItem>
          <TypeId>Component</TypeId>
          <SubtypeId>GVK_SpecialPackage1</SubtypeId>
          <Amount>1</Amount>
        </LootItem>
      </Loot>
      <LootContainerName>KOTH Loot</LootContainerName>
      <NoLargeGridPowerRange>3000</NoLargeGridPowerRange>
      <NoSafeZoneRange>4000</NoSafeZoneRange>
      <NoProjectorRange>4000</NoProjectorRange>
    </ZoneProfile>
    <!-- Crashed Starship: small grid rovers. CHECK coordinates. -->
    <ZoneProfile>
      <Name>CrashedStarship</Name>
      <Mode>Capture</Mode>
      <Attach>Coordinates</Attach>
      <Activation>Slot</Activation>
      <X>25896.19</X>
      <Y>61073.49</Y>
      <Z>25738.71</Z>
      <Radius>1000</Radius>
      <SmallGrids>true</SmallGrids>
      <LargeGrids>false</LargeGrids>
      <MinSmallGridBlocks>50</MinSmallGridBlocks>
      <CaptureSeconds>300</CaptureSeconds>
      <IdleDrainPlayers>3</IdleDrainPlayers>
      <MinPresenceShare>0.25</MinPresenceShare>
      <PointsPerCompletion>5</PointsPerCompletion>
      <CreditsPerPoint>200000</CreditsPerPoint>
      <PointsPerLoot>10</PointsPerLoot>
      <Loot>
        <LootItem>
          <TypeId>Component</TypeId>
          <SubtypeId>GVK_SpecialPackage1</SubtypeId>
          <Amount>1</Amount>
        </LootItem>
      </Loot>
      <LootContainerName>KOTH Loot</LootContainerName>
      <NoThrusterRange>3000</NoThrusterRange>
      <NoLargeGridPowerRange>3000</NoLargeGridPowerRange>
      <NoSafeZoneRange>4000</NoSafeZoneRange>
      <NoProjectorRange>4000</NoProjectorRange>
    </ZoneProfile>
    <!-- Scraptown: large grids, always on. CHECK coordinates (spawn group position), points and loot (were catch-up scoring and no valid loot). -->
    <ZoneProfile>
      <Name>Scraptown</Name>
      <Mode>Capture</Mode>
      <Attach>Coordinates</Attach>
      <Activation>AlwaysOn</Activation>
      <X>10115.76</X>
      <Y>30337.47</Y>
      <Z>52205.92</Z>
      <Radius>132</Radius>
      <SmallGrids>false</SmallGrids>
      <LargeGrids>true</LargeGrids>
      <MinLargeGridBlocks>25</MinLargeGridBlocks>
      <CaptureSeconds>600</CaptureSeconds>
      <IdleDrainPlayers>3</IdleDrainPlayers>
      <PointsPerCompletion>1</PointsPerCompletion>
      <CreditsPerPoint>0</CreditsPerPoint>
      <PointsPerLoot>0</PointsPerLoot>
      <LootContainerName>KOTH Loot</LootContainerName>
    </ZoneProfile>
  </Zones>
  <Slots>
    <!-- CHECK times. Each slot picks one of the three sites at random. -->
    <SlotConfig>
      <Name>Saturday</Name>
      <Start><Day>Saturday</Day><Hour>19</Hour><Minute>0</Minute></Start>
      <DurationMinutes>120</DurationMinutes>
      <Pool><string>KharToba</string><string>Kalash</string><string>CrashedStarship</string></Pool>
    </SlotConfig>
    <SlotConfig>
      <Name>Sunday</Name>
      <Start><Day>Sunday</Day><Hour>15</Hour><Minute>0</Minute></Start>
      <DurationMinutes>120</DurationMinutes>
      <Pool><string>KharToba</string><string>Kalash</string><string>CrashedStarship</string></Pool>
    </SlotConfig>
    <SlotConfig>
      <Name>Thursday</Name>
      <Start><Day>Thursday</Day><Hour>3</Hour><Minute>0</Minute></Start>
      <DurationMinutes>120</DurationMinutes>
      <Pool><string>KharToba</string><string>Kalash</string><string>CrashedStarship</string></Pool>
    </SlotConfig>
  </Slots>
</KothConfig>
